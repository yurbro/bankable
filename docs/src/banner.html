<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root { --ink:#0b1220; --muted:#5b6475; --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a; --yellow:#eda100; --bg:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; width:1600px; height:560px; background:
      radial-gradient(1200px 600px at 85% -10%, #e8f1fd 0%, transparent 60%),
      radial-gradient(800px 500px at -10% 110%, #fff1ea 0%, transparent 55%), var(--bg);
      font-family: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; color:var(--ink); }
  .wrap { padding:64px 80px; height:100%; display:flex; flex-direction:column; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:22px; }
  .mark { width:84px; height:84px; flex:none; filter:drop-shadow(0 12px 28px rgba(42,120,214,.28)); }
  .mark img { width:100%; height:100%; display:block; }
  h1 { margin:0; font-family:"Inter Display","Inter",sans-serif; font-size:90px; letter-spacing:-.045em; font-weight:800; line-height:1; }
  h1 small { font-family:"Inter","Noto Sans CJK SC",sans-serif; }
  h1 small { font-size:30px; font-weight:500; color:var(--muted); margin-left:18px; letter-spacing:0; }
  .tag { font-size:40px; font-weight:700; margin:26px 0 10px; }
  .sub { font-size:24px; color:var(--muted); margin:0; }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .chip { font-size:21px; padding:10px 18px; border-radius:999px; border:1.5px solid #d6dbe4; background:#fff; color:var(--ink); }
  .chip b { color:var(--blue); font-weight:700; margin-right:6px; }
  .out { display:flex; gap:18px; }
  .card { width:200px; padding:16px 18px; border-radius:16px; background:#fff; border:1.5px solid #e3e7ee; box-shadow:0 6px 18px rgba(11,18,32,.06); }
  .card .k { font-size:14px; color:var(--muted); letter-spacing:.5px; }
  .card .v { font-size:22px; font-weight:700; margin-top:4px; }
  .card.b { border-top:5px solid var(--blue);} .card.o { border-top:5px solid var(--orange);} .card.a { border-top:5px solid var(--aqua);} .card.y { border-top:5px solid var(--yellow);}
  .foot { display:flex; justify-content:space-between; align-items:flex-end; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="brand"><div class="mark"><img src="../images/logo.svg" alt=""></div><h1>Bankable <small>a Claude skill</small></h1></div>
    <div class="tag">经得起拷问的商业计划书</div>
    <p class="sub">Business plans that survive due diligence — 数字先于故事，每个主张都有出处，按读者定制。</p>
  </div>
  <div class="foot">
    <div class="row">
      <span class="chip"><b>读者</b>投资人 · 银行 · 政府评审 · 董事会</span>
      <span class="chip"><b>行业</b>任意，自带行业模块</span>
      <span class="chip"><b>语言</b>中文 / 中英双语</span>
    </div>
    <div class="out">
      <div class="card b"><div class="k">WORD</div><div class="v">计划书</div></div>
      <div class="card o"><div class="k">EXCEL</div><div class="v">三表模型</div></div>
      <div class="card a"><div class="k">MARKDOWN</div><div class="v">假设登记册</div></div>
      <div class="card y"><div class="k">PPT</div><div class="v">路演版</div></div>
    </div>
  </div>
</div>
</body>
</html>
